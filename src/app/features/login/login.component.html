<div class="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100">
    <div class="w-full max-w-md px-6">
        <!-- Login Card -->
        <div class="bg-white rounded-lg shadow-xl p-8 space-y-6">
            <!-- Header -->
            <div class="text-center">
                <h2 class="text-3xl font-bold text-gray-800">Welcome Back</h2>
                <p class="text-gray-600 mt-2">Please sign in to your account</p>
            </div>

            <!-- Form -->
            <form [formGroup]="formGroup" class="space-y-4">
                <!-- Username Input -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Username</label>
                    <p-inputgroup class="w-full">
                        <p-inputgroup-addon>
                            <i class="pi pi-user text-gray-500"></i>
                        </p-inputgroup-addon>
                        <input pInputText formControlName="username" [(ngModel)]="username"
                            placeholder="Enter your username" class="w-full" />
                    </p-inputgroup>
                </div>

                <!-- Password Input -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                    <p-inputgroup class="w-full">
                        <p-inputgroup-addon>
                            <i class="pi pi-lock text-gray-500"></i>
                        </p-inputgroup-addon>
                        <p-floatlabel variant="on">
                            <p-password formControlName="password" [(ngModel)]="password" class="w-full"
                                [toggleMask]="true" weakLabel="Too simple" mediumLabel="Average complexity"
                                strongLabel="Complex password" variant="filled" inputId="password_label">
                                <ng-template #footer>
                                    <p-divider />
                                    <ul class="pl-2 my-0 leading-normal">
                                        <li>At least one lowercase</li>
                                        <li>At least one uppercase</li>
                                        <li>At least one numeric</li>
                                        <li>Minimum 8 characters</li>
                                    </ul>
                                </ng-template>
                            </p-password>
                            <label for="password_label">Password</label>
                        </p-floatlabel>
                    </p-inputgroup>
                </div>

                <!-- Submit Button -->
                <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                    Sign In
                </button>
            </form>

            <!-- Remember Me & Forgot Password -->
            <div class="text-center text-sm">
                <a href="#" class="text-indigo-600 hover:text-indigo-800">Forgot password?</a>
            </div>

            <!-- Sign Up Link -->
            <div class="text-center text-sm text-gray-600">
                Don't have an account?
                <a href="#" class="text-indigo-600 hover:text-indigo-800 font-medium">Sign up</a>
            </div>
        </div>
    </div>
</div>
